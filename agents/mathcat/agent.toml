scope = "rig"
provider = "codex"
wake_mode = "fresh"
work_dir = ".gc/worktrees/{{.Rig}}/mathcats/{{.AgentBase}}"
nudge = "Run gc hook --claim --json now; if it returns work, execute the claimed formula immediately."
default_sling_formula = "mol-mathcat-work"
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]
idle_timeout = "2h"
min_active_sessions = 0
max_active_sessions = 1

[option_defaults]
model = "gpt-5.6-sol"
effort = "xhigh"
